<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hybrid-Deutschkurs B1 - Interaktives Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #f8fafc;
    }
    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 antialiased p-4 sm:p-8">

  <!-- Header -->
  <header class="max-w-7xl mx-auto mb-8 flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Hybrid-Deutschkurs B1</h1>
      <p class="text-slate-500 text-sm mt-1">Interaktive Modulübersicht und Lernmaterialien</p>
    </div>
    <button onclick="openConfigModal()" class="flex items-center gap-2 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl text-sm transition-colors duration-200">
      <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      Drive-Links konfigurieren
    </button>
  </header>

  <!-- Module Grid -->
  <main id="modulesGrid" class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <!-- Grid items strictly loaded by JavaScript -->
  </main>

  <!-- Modal -->
  <div id="configModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
      <div class="p-6 border-b border-slate-100 flex justify-between items-center">
        <h2 class="text-xl font-bold text-slate-800">Drive-Links bearbeiten</h2>
        <button onclick="closeConfigModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="inputsContainer" class="p-6 overflow-y-auto flex-1 space-y-4">
        <!-- Input fields rendered dynamically -->
      </div>
      <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
        <button onclick="closeConfigModal()" class="px-4 py-2 text-slate-600 text-sm font-medium hover:bg-slate-200/60 rounded-xl transition-colors">Abbrechen</button>
        <button onclick="saveLinks()" class="px-5 py-2 bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700 rounded-xl shadow-sm transition-colors">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    const defaultDriveLinks = [
      "https://docs.google.com/document/d/1l1r-oKwKf4Xwu_fWbdLsTXFRfRipNtl7/edit?usp=sharing&ouid=107822901514026672768&rtpof=true&sd=true",
      "https://docs.google.com/document/d/17_bGr3F5scGOxnsSzw6Hj1sqSL3uAsQV/edit?usp=sharing&ouid=107822901514026672768&rtpof=true&sd=true",
      "https://docs.google.com/document/d/1JnakTP8u44PO4TwsCZnnv92O1CbnA1Lk/edit?usp=sharing&ouid=107822901514026672768&rtpof=true&sd=true",
      "https://docs.google.com/document/d/1tuknWlNYXlJim7AckH1PVgdWQW1PASY5/edit?usp=sharing&ouid=107822901514026672768&rtpof=true&sd=true",
      "https://docs.google.com/document/d/1XZRHoXghVVObGov9vmvfHpW4zL_PUdsk/edit?usp=sharing&ouid=107822901514026672768&rtpof=true&sd=true",
      "https://docs.google.com/document/d/1-F4eSV0zl-RJwV4k_clh6dzlWiVHoTov/edit?usp=sharing&ouid=107822901514026672768&rtpof=true&sd=true",
      "https://docs.google.com/document/d/1r93KoDCc4LMWuh0N2lV6K1-XCXMCY2Zl/edit?usp=sharing&ouid=107822901514026672768&rtpof=true&sd=true",
      "https://docs.google.com/document/d/1IXJJ4LuOYbfYcdZRmdGRYTJMrk9Jhms2/edit?usp=sharing&ouid=107822901514026672768&rtpof=true&sd=true"
    ];

    const modules = [
      { id: 1, title: "Modul 1: Lektionen 1–3", active: true },
      { id: 2, title: "Modul 2: Lektionen 4–6", active: false },
      { id: 3, title: "Modul 3: Lektionen 7–9", active: false },
      { id: 4, title: "Modul 4: Lektionen 10–12", active: false },
      { id: 5, title: "Modul 5: Lektionen 13–15", active: false },
      { id: 6, title: "Modul 6: Lektionen 16–18", active: false },
      { id: 7, title: "Modul 7: Lektionen 19–21", active: false },
      { id: 8, title: "Modul 8: Lektionen 22–24", active: false }
    ];

    function getSavedLinks() {
      const saved = localStorage.getItem('hybrid_b1_drive_links');
      if (saved) {
        try { return JSON.parse(saved); } catch (e) { return defaultDriveLinks; }
      }
      return defaultDriveLinks;
    }

    function renderModules() {
      const links = getSavedLinks();
      const grid = document.getElementById('modulesGrid');
      grid.innerHTML = '';

      modules.forEach((mod, index) => {
        const link = links[index] || '';
        const card = document.createElement('div');
        
        if (mod.id === 1) {
          card.className = "bg-white rounded-2xl card-shadow border border-emerald-100 overflow-hidden group flex flex-col justify-between hover:-translate-y-1 transition-all duration-300 relative cursor-pointer min-h-[300px]";
          card.onclick = () => window.open(link, '_blank');
          card.innerHTML = `
            <div class="bg-emerald-600 text-white font-semibold px-5 py-3 text-sm flex items-center justify-between">
              <span>${mod.title}</span>
              <span class="bg-emerald-700 text-emerald-100 text-xs px-2.5 py-0.5 rounded-full font-medium">Aktiv</span>
            </div>
            <div class="p-4 bg-emerald-50/40 relative flex-1 flex flex-col items-center justify-center overflow-hidden">
              <svg class="w-full h-48 max-w-[260px]" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- River -->
                <path d="M 0,110 C 60,110 80,180 150,180 C 220,180 240,130 300,130" stroke="#a7f3d0" stroke-width="26" fill="none"/>
                <path d="M 0,110 C 60,110 80,180 150,180 C 220,180 240,130 300,130" stroke="#34d399" stroke-width="16" fill="none"/>

                <!-- Brandenburger Tor -->
                <g transform="translate(18, 55)">
                  <!-- Base / Steps -->
                  <rect x="0" y="42" width="60" height="4" rx="1" fill="#047857"/>
                  <!-- Columns -->
                  <rect x="4" y="16" width="5" height="26" fill="#047857"/>
                  <rect x="13" y="16" width="5" height="26" fill="#047857"/>
                  <rect x="22" y="16" width="5" height="26" fill="#047857"/>
                  <rect x="33" y="16" width="5" height="26" fill="#047857"/>
                  <rect x="42" y="16" width="5" height="26" fill="#047857"/>
                  <rect x="51" y="16" width="5" height="26" fill="#047857"/>
                  <!-- Entablature / Attic -->
                  <rect x="0" y="10" width="60" height="6" fill="#047857"/>
                  <rect x="2" y="6" width="56" height="4" fill="#065f46"/>
                  <!-- Quadriga statue top -->
                  <path d="M 22,6 L 26,0 L 34,0 L 38,6 Z" fill="#047857"/>
                  <circle cx="30" cy="-2" r="2.5" fill="#047857"/>
                  <line x1="30" y1="-2" x2="30" y2="-6" stroke="#047857" stroke-width="1.5"/>
                </g>

                <!-- Dotted path -->
                <path d="M 230,135 Q 200,165 142,125" stroke="#047857" stroke-width="3" stroke-dasharray="4,4" fill="none"/>
                <circle cx="230" cy="135" r="5" fill="#047857"/>
                <circle cx="230" cy="135" r="9" stroke="#047857" stroke-width="2" fill="none"/>

                <!-- Compass -->
                <g transform="translate(245, 15)">
                  <circle cx="18" cy="18" r="15" fill="white" stroke="#059669" stroke-width="2"/>
                  <path d="M 18,7 L 22,18 L 18,29 L 14,18 Z" fill="#059669"/>
                  <path d="M 18,7 L 22,18 L 18,18 Z" fill="#047857"/>
                  <text x="18" y="4" font-size="7" font-weight="bold" fill="#047857" text-anchor="middle">N</text>
                </g>

                <!-- Location Pin "Sie sind hier" -->
                <g transform="translate(112, 65)">
                  <path d="M 30,0 C 13.4,0 0,13.4 0,30 C 0,52.5 30,75 30,75 C 30,75 60,52.5 60,30 C 60,13.4 46.6,0 30,0 Z" fill="#065f46"/>
                  <circle cx="30" cy="28" r="22" fill="white"/>
                  <text x="30" y="24" font-size="9" font-weight="bold" fill="#065f46" text-anchor="middle">Sie sind</text>
                  <text x="30" y="35" font-size="9" font-weight="bold" fill="#065f46" text-anchor="middle">hier</text>
                </g>
              </svg>
            </div>
            <div class="px-5 py-3.5 bg-emerald-100/50 border-t border-emerald-100 flex justify-between items-center text-xs font-semibold text-emerald-800">
              <span>Materialien öffnen</span>
              <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
              </svg>
            </div>
          `;
        } else {
          card.className = "bg-white rounded-2xl card-shadow border border-slate-200/80 overflow-hidden group flex flex-col justify-between hover:-translate-y-1 transition-all duration-300 relative cursor-pointer min-h-[300px]";
          card.onclick = () => window.open(link, '_blank');
          card.innerHTML = `
            <div class="h-2 bg-[#00a0be]"></div>
            <div class="p-6 flex-1 flex flex-col items-center justify-center text-center">
              <div class="w-20 h-20 mb-5 text-[#00a0be] group-hover:scale-105 transition-transform duration-300 flex items-center justify-center">
                <svg class="w-full h-full drop-shadow-sm" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <!-- First Chat Bubble -->
                  <path d="M 12,14 C 6.5,14 2,18.5 2,24 C 2,27.5 3.8,30.5 6.5,32.3 L 4,40 L 12.5,36.5 C 13.6,36.8 14.8,37 16,37 C 21.5,37 26,32.5 26,27 C 26,21.5 21.5,14 16,14 Z" fill="#e0f2fe" stroke="#00a0be" stroke-width="3" stroke-linejoin="round"/>
                  <!-- Second Main Chat Bubble -->
                  <path d="M 22,22 C 15.4,22 10,27.4 10,34 C 10,38.2 12.2,41.9 15.5,44.1 L 12,54 L 22.5,49.5 C 24.2,50.1 26.1,50.5 28,50.5 C 40.2,50.5 50,43.1 50,34 C 50,24.9 40.2,22 28,22 Z" fill="#00a0be" stroke="#008ba5" stroke-width="3" stroke-linejoin="round"/>
                  <!-- Lines inside bubble -->
                  <line x1="20" y1="31" x2="36" y2="31" stroke="white" stroke-width="3" stroke-linecap="round"/>
                  <line x1="20" y1="38" x2="30" y2="38" stroke="white" stroke-width="3" stroke-linecap="round"/>
                </svg>
              </div>
              <h3 class="text-lg font-bold text-slate-800">${mod.title}</h3>
            </div>
            <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100 flex justify-between items-center text-xs font-medium text-slate-500 group-hover:text-[#00a0be] transition-colors">
              <span>Drive-Dokument</span>
              <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
              </svg>
            </div>
          `;
        }
        grid.appendChild(card);
      });
    }

    function openConfigModal() {
      const links = getSavedLinks();
      const container = document.getElementById('inputsContainer');
      container.innerHTML = '';

      modules.forEach((mod, index) => {
        const div = document.createElement('div');
        div.className = "flex flex-col gap-1.5";
        div.innerHTML = `
          <label class="text-xs font-semibold text-slate-600">${mod.title}</label>
          <input type="url" id="input_mod_${index}" value="${links[index] || ''}" placeholder="https://docs.google.com/..." class="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"/>
        `;
        container.appendChild(div);
      });

      document.getElementById('configModal').classList.remove('hidden');
    }

    function closeConfigModal() {
      document.getElementById('configModal').classList.add('hidden');
    }

    function saveLinks() {
      const newLinks = modules.map((_, index) => {
        return document.getElementById(`input_mod_${index}`).value.trim();
      });
      localStorage.setItem('hybrid_b1_drive_links', JSON.stringify(newLinks));
      closeConfigModal();
      renderModules();
    }

    // Initial load
    renderModules();
  </script>
</body>
</html>
